name: Prepare release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (for example v0.2.0)
        required: true
permissions:
  contents: write
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify and package
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
          go test ./...
          go vet ./...
          version="${RELEASE_TAG#v}"
          go build -o /tmp/solar-monitor .
          /tmp/solar-monitor --version | grep -F "solar-monitor $version ("
          mkdir -p dist
          binary="solar-monitor-$version-windows-amd64.exe"
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o "dist/$binary" .
          cp README.md dist/README.md
          cp "docs/releases/$RELEASE_TAG.md" dist/RELEASE-NOTES.md
          cd dist
          zip "solar-monitor-$version-windows-amd64.zip" "$binary" README.md RELEASE-NOTES.md
          sha256sum "$binary" *.zip > SHA256SUMS.txt
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft > /tmp/release.json; then
            test "$(jq -r .isDraft /tmp/release.json)" = true
            gh release edit "$RELEASE_TAG" --title "Solar Monitor $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Solar Monitor $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
          fi
          gh release upload "$RELEASE_TAG" dist/*.exe dist/*.zip dist/SHA256SUMS.txt --clobber
